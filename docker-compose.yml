services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeflow
      POSTGRES_PASSWORD: lifeflow_dev
      POSTGRES_DB: lifeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
